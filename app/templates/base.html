<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  <style>
    :root {
      --accent: #1a7f5a;
      --accent-dark: #146147;
      --border: #c4c9d0;
      --label: #5f6670;
      --error: #b00020;
    }
    body { font-family: sans-serif; max-width: 28rem; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }

    nav { display: flex; gap: 1.25rem; }
    nav a { color: var(--label); text-decoration: none; }
    nav a:hover { color: var(--accent); }
    nav a[aria-current="page"] { color: var(--accent); font-weight: bold; }

    .field { position: relative; margin-top: 1.25rem; }
    .field input, .field select {
      width: 100%; box-sizing: border-box;
      padding: 1.45rem .9rem .5rem;
      font-size: 1rem; font-family: inherit;
      border: 1px solid var(--border); border-radius: .6rem; background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus, .field select:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(26, 127, 90, .2);
    }
    .field label {
      position: absolute; left: .9rem; top: 50%; transform: translateY(-50%);
      color: var(--label); pointer-events: none;
      transition: top .15s, font-size .15s, transform .15s, color .15s;
    }
    /* Float the label to the top of the box when the field is focused, filled, or a dropdown. */
    .field input:focus + label,
    .field input:not(:placeholder-shown) + label,
    .select-field label {
      top: .4rem; transform: none; font-size: .75rem;
    }
    .field input:focus + label, .field select:focus + label { color: var(--accent); }

    .error { color: var(--error); margin: .3rem 0 0 .9rem; font-size: .9rem; }
    .confirmed { background: #e6f4ea; padding: .75rem; }

    button {
      display: block; width: 100%; margin-top: 2rem; padding: .9rem 1.5rem;
      font-size: 1.1rem; font-weight: bold; font-family: inherit;
      color: #fff; background: var(--accent);
      border: none; border-radius: 999px; cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: var(--accent-dark); }
    button:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 3px; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('building_form') }}" {% if request.endpoint == 'building_form' %}aria-current="page"{% endif %}>Building</a>
    <a href="{{ url_for('bill_form') }}" {% if request.endpoint == 'bill_form' %}aria-current="page"{% endif %}>Utility bill</a>
  </nav>
{% block content %}{% endblock %}
</body>
</html>
